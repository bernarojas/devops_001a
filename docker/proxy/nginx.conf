# =============================================================================
#  Proxy inverso de la solución de ventas.
#
#  Es el único contenedor que publica un puerto hacia la máquina anfitriona.
#  Todo lo que llega desde Internet entra por acá y se reenvía a la aplicación
#  por la red interna de Docker.
# =============================================================================

# El archivo de PID va a /tmp y no a /var/run porque el contenedor se ejecuta
# con el sistema de archivos en modo de sólo lectura. /tmp es uno de los dos
# únicos directorios escribibles, montados como tmpfs desde la orquestación.
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Todos los directorios temporales caen bajo /tmp, por la misma razón que
    # el PID. Sin esto, nginx falla al arrancar en modo de sólo lectura en
    # cuanto recibe una respuesta que no cabe en memoria.
    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # No anunciar la versión de nginx en las cabeceras ni en las páginas de
    # error: es información que sólo le sirve a quien busca una vulnerabilidad
    # conocida.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # El formato incorpora X-Forwarded-For para que el registro conserve la
    # dirección real de quien consulta y no la del propio proxy.
    log_format  principal  '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout principal;
    error_log  /dev/stderr warn;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # Tamaño máximo de una petición. La aplicación no recibe archivos, así que
    # un límite bajo cierra una vía de abuso sin costo alguno.
    client_max_body_size 2m;

    server {
        listen 80 default_server;
        server_name _;

        # ---------------------------------------------------------------
        #  Resolución dinámica del nombre de la aplicación
        # ---------------------------------------------------------------
        #  ESTE ES EL PUNTO MENOS OBVIO DE TODO EL ARCHIVO.
        #
        #  Con un bloque "upstream" clásico, o con el nombre escrito
        #  directamente en proxy_pass, nginx resuelve el nombre UNA sola vez,
        #  al arrancar, y se queda con esa dirección IP para siempre. Funciona
        #  perfecto en el primer despliegue y falla en el segundo: al recrear
        #  el contenedor de la aplicación, Docker le asigna otra dirección, y
        #  el proxy sigue enviando tráfico a una que ya no existe. El síntoma
        #  es un 502 que aparece recién en la segunda publicación.
        #
        #  La solución tiene dos mitades y las dos son necesarias:
        #    1. "resolver" apunta al DNS interno de Docker (127.0.0.11), con
        #       una validez de 10 segundos para la caché.
        #    2. El destino se arma con una VARIABLE. Es lo que obliga a nginx a
        #       resolver en cada petición en lugar de al arrancar.
        #
        #  ipv6=off porque la red de Docker no entrega direcciones IPv6 y, sin
        #  esta opción, nginx pierde tiempo en una consulta AAAA que no lleva
        #  a ninguna parte.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $aplicacion "web";

        # ---------------------------------------------------------------
        #  Comprobación de estado del propio proxy
        # ---------------------------------------------------------------
        #  Responde el proxy, sin consultar a la aplicación: la pregunta que
        #  contesta es "¿está nginx atendiendo?", no "¿está todo sano?".
        #  Si consultara a la aplicación, una caída de ésta haría que Docker
        #  reiniciara también el proxy, que no tiene ningún problema.
        location = /proxy-salud {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "proxy-vivo\n";
        }

        location / {
            # Con una variable en proxy_pass, nginx NO agrega la ruta por su
            # cuenta: hay que pasarla explícitamente con $request_uri.
            proxy_pass http://$aplicacion:8080$request_uri;

            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Cabeceras de conexión para que funcionen las respuestas en
            # streaming y una eventual conexión WebSocket.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Ante un 502/503/504, reintentar con la siguiente dirección que
            # devuelva el DNS. Cubre el instante exacto del reemplazo de
            # contenedor durante un despliegue.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
