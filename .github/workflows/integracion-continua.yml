# =============================================================================
#  INTEGRACIÓN CONTINUA
#
#  Se ejecuta en cada solicitud de incorporación de cambios y en cada empuje a
#  una rama de trabajo. Compila, ejecuta las pruebas y construye las imágenes
#  PERO NO PUBLICA NI DESPLIEGA NADA.
#
#  Esa separación es el punto: la rama principal es la línea estable, y lo que
#  llega a ella ya pasó por acá. El valor de la integración continua no está en
#  automatizar la compilación sino en CUÁNDO se detectan los defectos: minutos
#  después de introducirlos, mientras quien los escribió todavía recuerda el
#  contexto.
#
#  El orden tampoco es casual. Las pruebas van ANTES de construir las imágenes:
#  una compilación defectuosa no llega siquiera a empaquetarse.
# =============================================================================

name: Integración continua

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Sólo lectura del repositorio: esta canalización no publica nada, así que no
# necesita ningún permiso de escritura. Es el mismo criterio de mínimo
# privilegio que se aplicó a los grupos de seguridad de red.
permissions:
  contents: read

# Un empuje nuevo sobre la misma rama cancela la ejecución anterior: no tiene
# sentido gastar minutos de agente validando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  #  Compilación y pruebas
  # ---------------------------------------------------------------------------
  #  Los pasos viven en un flujo reutilizable que también invoca la entrega
  #  continua, de modo que desplegar sin haber probado sea imposible.
  compilar-y-probar:
    name: Compilación y pruebas
    uses: ./.github/workflows/compilar-y-probar.yml

  # ---------------------------------------------------------------------------
  #  Validación de las imágenes
  # ---------------------------------------------------------------------------
  #  Construye las dos imágenes propias sin publicarlas. Sirve para que un error
  #  en un Dockerfile se detecte en la solicitud de cambios y no en la rama
  #  principal, cuando ya es tarde.
  construir-imagenes:
    name: Construir las imágenes (sin publicar)
    runs-on: ubuntu-latest
    needs: compilar-y-probar

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # La caché se comparte por ámbito con la canalización de entrega: cuando
      # el cambio llega a la rama principal, gran parte de las capas ya están
      # construidas y la publicación tarda una fracción.
      - name: Construir la imagen de la aplicación
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PruebaTecnica.Web/Dockerfile
          push: false
          tags: ventas-web:validacion
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Construir la imagen del proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/proxy/Dockerfile
          push: false
          tags: ventas-proxy:validacion
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max

  # ---------------------------------------------------------------------------
  #  Validación de la orquestación y de los scripts
  # ---------------------------------------------------------------------------
  #  Un error de sintaxis o una variable mal escrita en docker-compose.prod.yml
  #  no se manifestaría hasta el despliegue. `config` lo resuelve en segundos.
  validar-orquestacion:
    name: Validar la orquestación
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      # Valores de relleno: acá sólo se comprueba que el archivo sea válido y
      # que toda variable referenciada esté declarada. No se levanta nada.
      - name: Interpretar docker-compose.prod.yml
        env:
          REGISTRO: registro.ejemplo.azurecr.io
          ETIQUETA: '0'
          MSSQL_SA_PASSWORD: 'Relleno#Para!Validar1'
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Revisar los scripts de shell
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning \
            scripts/despliegue/*.sh \
            scripts/infraestructura/*.sh \
            docker/inicializacion/*.sh
