# =============================================================================
#  COMPILAR Y PROBAR  (flujo reutilizable)
#
#  No se dispara solo: lo invocan la canalización de integración continua y la
#  de entrega continua mediante `uses:`.
#
#  POR QUÉ ESTÁ EN UN ARCHIVO APARTE
#  Porque la alternativa es copiar los mismos pasos en las dos canalizaciones,
#  y dos copias se separan con el tiempo. La copia que se queda atrás suele ser
#  la de despliegue, con lo cual se termina publicando sin haber ejecutado las
#  pruebas que la otra sí ejecuta. Teniéndolo una sola vez, eso no puede pasar.
# =============================================================================

name: Compilar y probar

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar el SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # La caché de NuGet se apoya en el hash de los archivos de proyecto: sólo
      # se invalida cuando cambia alguna dependencia, no en cada commit.
      - name: Restaurar la caché de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore PruebaTecnica.sln

      # --no-restore y --no-build en los pasos siguientes: cada cosa se hace
      # una sola vez y queda claro en qué paso exacto falla.
      - name: Compilar
        run: dotnet build PruebaTecnica.sln --configuration Release --no-restore

      - name: Ejecutar las pruebas
        run: |
          dotnet test PruebaTecnica.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=resultados.trx" \
            --results-directory ./resultados

      # if: always() para que el informe se publique también cuando las pruebas
      # fallan, que es justamente cuando hace falta leerlo.
      - name: Publicar los resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-pruebas-${{ github.run_number }}
          path: ./resultados
          retention-days: 7
