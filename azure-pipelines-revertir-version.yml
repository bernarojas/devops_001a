# =============================================================================
#  REVERTIR A UNA VERSIÓN ANTERIOR
#
#  Se ejecuta a mano, indicando la etiqueta a la que se quiere volver.
#
#  Esta canalización es la demostración práctica de para qué sirve un registro
#  de contenedores. Volver atrás no reconstruye nada, no recompila nada y no
#  vuelve a ejecutar las pruebas: descarga una imagen que ya existe, que ya fue
#  probada en su momento, y la levanta. Es un cambio de etiqueta.
#
#  Sin registro, "volver a la versión anterior" significaría revertir el
#  código, esperar una compilación completa y confiar en que el resultado sea
#  idéntico al de la vez anterior. Con registro, es un minuto y es exacto.
# =============================================================================

name: reversion-$(Date:yyyyMMdd)$(Rev:.r)

# Sólo ejecución manual: revertir es una decisión, no una consecuencia
# automática de un cambio en el código.
trigger: none
pr: none

parameters:
  - name: etiqueta
    displayName: 'Etiqueta a la que volver (número de compilación, por ejemplo 27)'
    type: string

variables:
  conexionRegistro: 'acrventas-conexion'
  registroServidor: 'acrventas.azurecr.io'

stages:

  - stage: Revertir
    displayName: 'Revertir a la etiqueta ${{ parameters.etiqueta }}'
    jobs:
      - deployment: RevertirEnVM
        displayName: 'Desplegar la versión anterior'

        environment:
          name: 'produccion'
          resourceType: VirtualMachine
          resourceName: 'vm-web-01'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Docker@2
                  displayName: 'Autenticarse en el registro de contenedores'
                  inputs:
                    command: login
                    containerRegistry: '$(conexionRegistro)'

                # Se comprueba que la etiqueta exista ANTES de tocar nada en
                # marcha. Un número equivocado acá dejaría la solución detenida
                # sin nada que levantar; fallar antes de empezar es mucho mejor
                # que fallar a medias.
                - script: |
                    set -euo pipefail
                    for imagen in ventas-web ventas-proxy; do
                      referencia="$(registroServidor)/${imagen}:${{ parameters.etiqueta }}"
                      if docker manifest inspect "$referencia" > /dev/null 2>&1; then
                        echo "Encontrada: $referencia"
                      else
                        echo "ERROR: no existe $referencia en el registro." >&2
                        exit 1
                      fi
                    done
                  displayName: 'Comprobar que la etiqueta existe en el registro'

                - script: |
                    umask 077
                    {
                      echo "REGISTRO=$(registroServidor)"
                      echo "ETIQUETA=${{ parameters.etiqueta }}"
                      echo "MSSQL_SA_PASSWORD=$(MSSQL_SA_PASSWORD)"
                    } > .env
                  displayName: 'Escribir las variables del despliegue'
                  workingDirectory: '$(Pipeline.Workspace)/s'

                - script: docker compose -f docker-compose.prod.yml pull
                  displayName: 'Descargar las imágenes de esa versión'
                  workingDirectory: '$(Pipeline.Workspace)/s'

                - script: |
                    docker compose -f docker-compose.prod.yml up -d --remove-orphans
                    docker compose -f docker-compose.prod.yml ps -a
                  displayName: 'Levantar la versión anterior'
                  workingDirectory: '$(Pipeline.Workspace)/s'

                - script: |
                    set -o pipefail
                    bash scripts/despliegue/verificar-stack.sh | tee verificacion.txt
                  displayName: 'Verificar la solución desplegada'
                  workingDirectory: '$(Pipeline.Workspace)/s'

                - script: docker logout $(registroServidor)
                  displayName: 'Cerrar la sesión del registro'
                  condition: always()
